name: Special Entities - proba_od

on:
  workflow_dispatch:
  # (optionnel) tous les jours à 05:20 UTC
  # schedule:
  #   - cron: "20 5 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run special entities builder
        run: |
          python scripts/build_proba_od_special_entities.py

      - name: Commit outputs (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add precomputed/proba_od/special_entities/*.csv || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update proba_od for special entities (PAPROVENCE, PROVENCEPA)"
          git push
