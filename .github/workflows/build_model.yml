name: Build TGVmax stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Init legacy by_entity (first time only)
        run: |
          python scripts/init_legacy_by_entity.py

      - name: Build snapshot_today_od + stations + light metadata
        run: |
          python scripts/build_light_today.py

      - name: Select batch entities
        run: |
          python scripts/select_batch_entities.py

      - name: Build proba_od for batch entities
        run: |
          python scripts/build_proba_od_for_entities.py

      - name: Aggregate proba_od (csv + parquet)
        run: |
          python scripts/aggregate_proba_od.py

      - name: Commit & push precomputed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add precomputed

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update precomputed TGVmax stats [skip ci]"
            git push
          fi
