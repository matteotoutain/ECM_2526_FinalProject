name: Build TGVmax stats

on:
  schedule:
    - cron: "0 3 * * *"   # tous les jours à 03:00 UTC
  workflow_dispatch:       # déclenchement manuel possible

jobs:
  build-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build model stats
        run: |
          python build_model_stats.py

      - name: Commit and push updated stats
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== Contenu du repo après build_model_stats ==="
          ls -R

          echo "=== Git status avant ajout ==="
          git status

          # On s'assure que le dossier existe (au cas où)
          mkdir -p precomputed

          echo "=== Contenu de precomputed ==="
          ls -l precomputed || echo "precomputed est vide"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # On ajoute tout le dossier, pas seulement precomputed/*
          git add precomputed

          echo "=== Git status après git add ==="
          git status

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update precomputed TGVmax stats [skip ci]"
            git push
          fi
